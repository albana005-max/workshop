<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Belanja Bersama</title>
    <!-- Import Font Modern (Inter) dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* === BASE STYLES === */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5; /* Warna background abu-abu lembut ala Facebook/Twitter */
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* === CONTAINER UTAMA === */
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); /* Efek melayang */
            margin-top: 20px;
        }

        h2, h3 {
            color: #1a1a1a;
            margin-top: 0;
        }

        h2 { text-align: center; margin-bottom: 25px; }

        /* === FORMS & INPUTS === */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .form-group.horizontal {
            flex-direction: row;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
        }

        /* === BUTTONS === */
        button {
            padding: 12px 18px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        button:active { transform: scale(0.97); }

        .btn-primary { background-color: #007bff; color: white; }
        .btn-primary:hover { background-color: #0056b3; box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3); }

        .btn-success { background-color: #10b981; color: white; }
        .btn-success:hover { background-color: #059669; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }

        .btn-danger { background-color: #ef4444; color: white; }
        .btn-danger:hover { background-color: #dc2626; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }

        .btn-secondary { background-color: #6b7280; color: white; padding: 8px 12px;}
        .btn-secondary:hover { background-color: #4b5563; }

        /* === USER INFO BAR === */
        .user-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #dee2e6;
        }

        /* === LIST ITEMS (CARD STYLE) === */
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 15px;
            background: #ffffff;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #eaeaea;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        li:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        /* Khusus tampilan list di Dashboard */
        #kumpulanDaftarUI li {
            border-left: 5px solid #007bff;
            font-size: 16px;
        }

        /* === SECTION UNDANGAN === */
        .invite-section {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px dashed #ced4da;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <!-- BAGIAN 1: LAYAR LOGIN & REGISTRASI -->
        <div id="authSection">
            <h2>🛍️ Daftar Belanja Bersama</h2>
            <div class="form-group">
                <input type="email" id="inputEmail" placeholder="Email (misal: dimas@contoh.com)">
                <input type="password" id="inputPassword" placeholder="Password (min 6 karakter)">
            </div>
            <div class="form-group horizontal">
                <button id="btnLogin" class="btn-success" style="flex: 1;">Masuk</button>
                <button id="btnRegister" class="btn-primary" style="flex: 1;">Daftar Akun Baru</button>
            </div>
            <p id="pesanError" style="color: #ef4444; text-align: center; font-size: 14px; margin-top: 10px;"></p>
        </div>

        <!-- BAGIAN 2: APLIKASI UTAMA (Disembunyikan saat belum login) -->
        <div id="appSection" style="display: none;">
            
            <div class="user-info-bar">
                <span style="font-size: 14px; color: #4b5563;">Halo, <strong id="namaUser" style="color: #111827; font-size: 16px;"></strong>!</span>
                <button id="btnLogout" class="btn-danger" style="padding: 8px 15px;">Logout</button>
            </div>

            <!-- LAYAR A: DASHBOARD DAFTAR BELANJA -->
            <div id="dashboardLayar">
                <h3 style="border-bottom: 2px solid #f0f2f5; padding-bottom: 10px;">📋 Kumpulan Daftar Belanja</h3>
                <div class="form-group horizontal" style="margin-top: 20px;">
                    <input type="text" id="inputNamaDaftar" placeholder="Nama daftar baru (misal: Belanja Kos)...">
                    <button id="btnBuatDaftar" class="btn-success">Buat Daftar</button>
                </div>
                <ul id="kumpulanDaftarUI"></ul>
            </div>

            <!-- LAYAR B: DETAIL ISI BARANG -->
            <div id="detailLayar" style="display: none;">
                <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
                    <button id="btnKembali" class="btn-secondary">&larr; Kembali</button>
                    <h3 id="judulDaftarAktif" style="margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Nama Daftar</h3>
                </div>

                <!-- Bagian Mengundang Teman -->
                <div class="invite-section">
                    <div style="font-size: 12px; font-weight: 600; color: #6b7280; margin-bottom: 8px; text-transform: uppercase;">🤝 Undang Anggota</div>
                    <div class="form-group horizontal" style="margin-bottom: 0;">
                        <input type="email" id="inputUndang" placeholder="Email teman...">
                        <button id="btnUndang" class="btn-primary">Undang</button>
                    </div>
                </div>
                
                <hr style="border: 0; border-top: 1px solid #eaeaea; margin: 20px 0;">

                <!-- Bagian Tambah Barang -->
                <div class="form-group horizontal">
                    <input type="text" id="inputBarang" placeholder="Tambahkan barang (misal: Beras 5kg)...">
                    <button id="btnTambah" class="btn-success">Tambah</button>
                </div>
                <ul id="daftarBelanja"></ul>
            </div>

        </div>
    </div>

    <!-- Panggil file logika JS sebagai module -->
    <script type="module" src="app.js"></script>
    
</body>
</html>
